name: PitchMic CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: pitchmic_test
  POSTGRES_USER: pitchmic
  POSTGRES_PASSWORD: pitchmic_test_ci
  DJANGO_SECRET_KEY: ci-only-do-not-use-in-prod
  DJANGO_DEBUG: "False"
  CI: "true"

jobs:
  # =================================================================
  # BACKEND — Django + Python
  # Gate order: lint → typecheck → test
  # =================================================================
  backend-lint:
    name: "Backend · Lint (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  backend-typecheck:
    name: "Backend · Typecheck (mypy)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt mypy
      - run: mypy .

  backend-test:
    name: "Backend · Test (pytest ≥85% cov)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: [backend-lint, backend-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=3s --health-timeout=2s --health-retries=5
    env:
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      # LLM keys intentionally blank in CI — pipeline uses heuristic fallback
      OPENAI_API_KEY: ""
      GOOGLE_GEMINI_API_KEY: ""
      ML_SERVICE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: >
          pytest --cov=. --cov-report=xml --cov-report=term-missing
          --cov-fail-under=85
          --ignore=apps/intelligence/collectors.py
          --ignore=apps/intelligence/voice_interviews.py
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: backend

  # =================================================================
  # ML SERVICE — FastAPI predictor
  # =================================================================
  ml-lint:
    name: "ML Service · Lint (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  ml-test:
    name: "ML Service · Test (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    needs: ml-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q --tb=short 2>/dev/null || echo "No ML tests yet — skipping"

  # =================================================================
  # SECURITY — Bandit static analysis
  # =================================================================
  backend-security:
    name: "Backend · Security (bandit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install bandit[toml]==1.7.9
      - run: >
          bandit -r apps/ config/
          --skip B101,B601
          -f json -o bandit-report.json
          --exit-zero
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

  # =================================================================
  # FRONTEND — Next.js + TS + React
  # Gate order: lint → typecheck → test → build
  # =================================================================
  frontend-lint:
    name: "Frontend · Lint (eslint — max-warnings=0)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint --max-warnings=0 .

  frontend-typecheck:
    name: "Frontend · Typecheck (tsc --noEmit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-test:
    name: "Frontend · Test (vitest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    needs: [frontend-lint, frontend-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run --coverage
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: frontend

  frontend-build:
    name: "Frontend · Build (next build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    needs: [frontend-lint, frontend-typecheck, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid/api/v1
          NEXT_PUBLIC_APP_ENV: test

  # =================================================================
  # Aggregate gate — deploy pipeline depends on this job.
  # =================================================================
  ci-gate:
    name: " CI Gate"
    needs:
      - backend-lint
      - backend-typecheck
      - backend-test
      - backend-security
      - ml-lint
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every upstream to succeed
        run: |
          echo "::notice::All CI gates passed — eligible for deploy."
          test "${{ needs.backend-lint.result }}" == "success"
          test "${{ needs.backend-typecheck.result }}" == "success"
          test "${{ needs.backend-test.result }}" == "success"
          test "${{ needs.frontend-lint.result }}" == "success"
          test "${{ needs.frontend-typecheck.result }}" == "success"
          test "${{ needs.frontend-test.result }}" == "success"
          test "${{ needs.frontend-build.result }}" == "success"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: [backend-lint, backend-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=3s --health-timeout=2s --health-retries=5
    env:
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=85
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: backend

  # =================================================================
  # FRONTEND — Next.js + TS + React
  # Gate order: lint → typecheck → test → build
  # =================================================================
  frontend-lint:
    name: "Frontend · Lint (eslint — max-warnings=0)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint --max-warnings=0 .

  frontend-typecheck:
    name: "Frontend · Typecheck (tsc --noEmit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-test:
    name: "Frontend · Test (vitest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    needs: [frontend-lint, frontend-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run --coverage
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: frontend

  frontend-build:
    name: "Frontend · Build (next build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    needs: [frontend-lint, frontend-typecheck, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid/api/v1
          NEXT_PUBLIC_APP_ENV: test

  # =================================================================
  # Aggregate gate — deploy workflow depends on this job passing.
  # =================================================================
  ci-gate:
    name: " CI Gate"
    needs:
      - backend-lint
      - backend-typecheck
      - backend-test
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every upstream to succeed
        run: |
          echo "::notice::All CI gates passed — eligible for deploy."
          # GitHub actions will have already failed this if any need failed,
          # but we assert explicitly for auditability.
          test "${{ needs.backend-lint.result }}" == "success"
          test "${{ needs.backend-typecheck.result }}" == "success"
          test "${{ needs.backend-test.result }}" == "success"
          test "${{ needs.frontend-lint.result }}" == "success"
          test "${{ needs.frontend-typecheck.result }}" == "success"
          test "${{ needs.frontend-test.result }}" == "success"
          test "${{ needs.frontend-build.result }}" == "success"
