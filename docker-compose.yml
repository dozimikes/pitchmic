# =====================================================================
# PitchMic — Docker Compose
# Five services behind Caddy reverse proxy:
#   caddy      :80    — routing + TLS termination
#   frontend   :3000  — Next.js 14 App Router
#   backend    :8000  — Django + DRF + ASGI (Uvicorn)
#   postgres   :5432  — primary datastore
#   redis      :6379  — cache + Django Channels + Celery broker
# =====================================================================
name: pitchmic

services:
  # ---------- Edge Proxy ----------
  caddy:
    image: caddy:2.8-alpine
    container_name: pitchmic-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - ml-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------- Next.js Frontend ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-development}
    container_name: pitchmic-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Django Backend ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BACKEND_TARGET:-development}
    container_name: pitchmic-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/').status<500 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    command: >
      sh -c "uvicorn config.asgi:application --host 0.0.0.0 --port 8000
             --reload --reload-dir /app
             --log-level info"

  # ---------- Postgres ----------
  postgres:
    image: postgres:16-alpine
    container_name: pitchmic-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  # ---------- Redis ----------
  redis:
    image: redis:7.2-alpine
    container_name: pitchmic-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  # ---------- Celery Worker ----------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BACKEND_TARGET:-development}
    container_name: pitchmic-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Two queues: default (notifications, emails) and ml (matching, analytics, intelligence)
    command: >
      sh -c "celery -A config worker --loglevel=info -Q default,ml --concurrency=4"
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------- Celery Beat (scheduler) ----------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BACKEND_TARGET:-development}
    container_name: pitchmic-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # --scheduler django_celery_beat.schedulers:DatabaseScheduler stores schedule in DB
    command: >
      sh -c "celery -A config beat --loglevel=info
             --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  # ---------- ChromaDB (vector store for digital brain / RAG) ----------
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: pitchmic-chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN:-pitchmic-chroma-secret}
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.token.TokenConfigServerAuthCredentialsProvider
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token.TokenAuthServerProvider
    volumes:
      - chroma_data:/chroma/chroma
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- ML Serving Service (FastAPI + XGBoost/DNN predictor) ----------
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: pitchmic-ml-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MODEL_PATH=/app/models
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./ml:/app
      - ml_models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  chroma_data:
  ml_models:
